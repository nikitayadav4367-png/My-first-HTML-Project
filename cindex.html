
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Front Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #212121;
            color: white;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #171717;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 24px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            background: #303030;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar p {
            color: #cccccc;
            padding: 8px;
        }

        /* Main Section */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main h1 {
            font-size: 32px;
            text-align: center;
        }

        /* Message Box */
        .chat-box {
            width: 80%;
            max-width: 650px;
            display: flex;
            background: #303030;
            padding: 10px;
            border-radius: 15px;
        }

        .chat-box input {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: white;
            border: none;
            outline: none;
            font-size: 16px;
            min-width: 0;
        }

        .chat-box button {
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
        }

        #response {
            margin-top: 20px;
            max-width: 650px;
            width: 80%;
            overflow-wrap: anywhere;
        }

        .message {
            background: #303030;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 100px;
                padding: 10px;
            }

            .sidebar h2 {
                font-size: 18px;
            }

            .main h1 {
                font-size: 23px;
            }

            .chat-box {
                width: 95%;
                box-sizing: border-box;
            }

            #response {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>ChatGPT</h2>
        <button onclick="newChat()">+ New Chat</button>
        <p>Explore ideas</p>
        <p>Learn something</p>
    </div>

    <div class="main">
        <h1>What can I help with?</h1>

        <div class="chat-box">
            <input
                type="text"
                id="message"
                placeholder="Message ChatGPT..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >
            <button onclick="sendMessage()">Send</button>
        </div>

        <div id="response"></div>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("message");
            let message = input.value.trim();

            if (message === "") {
                alert("Please enter a message!");
                return;
            }

            let response = document.getElementById("response");

            let userMessage = document.createElement("div");
            userMessage.className = "message";
            userMessage.textContent = "You: " + message;

            let botMessage = document.createElement("div");
            botMessage.className = "message";
            botMessage.textContent =
                "ChatGPT: Hello! This is a demo chatbot.";

            response.replaceChildren(userMessage, botMessage);
            input.value = "";
        }

        function newChat() {
            document.getElementById("message").value = "";
            document.getElementById("response").replaceChildren();
        }
    </script>

</body>
</html>
